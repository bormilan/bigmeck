name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.27.0'
      - name: Check formatting
        run: rebar3 fmt --check
      - name: Compile and lint
        run: rebar3 do "compile,lint"
      - name: Check types with Dialyzer
        run: rebar3 dialyzer
      - name: Test with coverage
        run: rebar3 eunit --cover
      - name: Require 100% coverage
        run: rebar3 as test cover --min_coverage 100 --verbose
